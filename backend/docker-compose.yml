version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: codexmind_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO

volumes:
  qdrant_data:
    driver: local
