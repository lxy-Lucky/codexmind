[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codexmind-backend"
version = "0.1.0"
description = "CodexMind — Code Intelligence Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Qdrant vector DB
    "qdrant-client>=1.9.0",

    # Embedding: bge-m3
    "FlagEmbedding>=1.2.10",
    "torch>=2.3.0",

    # LLM: Ollama
    "ollama>=0.2.0",

    # Code parsing
    "tree-sitter>=0.22.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",

    # Neo4j
    "neo4j>=5.20.0",

    # BM25
    "rank-bm25>=0.2.2",

    # Utils
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
